
name: MCP Integration Tests

on:
  push:
    branches:
      - main
      - feature/mcp-integration-4
  pull_request:
    branches:
      - main


jobs:
  test-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: clia

    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: |
          python -m pip install "mcp>=1,<2" chromadb rank-bm25

      - name: Build RAG database
        run: python servers/custom_rag/ingest.py

      - name: Test all three MCP servers
        run: python -m clia.cli.test_mcp
      
      - name: Test autonomous agent loop
        run: python -m clia.cli.test_agent_loop
